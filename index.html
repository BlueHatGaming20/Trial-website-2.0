<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: #334155;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }

    nav a:hover {
      color: #38bdf8;
    }

    main {
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #38bdf8;
      color: black;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background: #0ea5e9;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
  </style>

</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>Built by Dibyadyuti 🚀</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <section>
      <h2>About This Site</h2>
      <p>This is a simple website running on OneCompiler.</p>
    </section>

    <section>
      <h2>Click Button 👇</h2>
      <button onclick="showMessage()">Click Me</button>
    </section>
  </main>

  <footer>
    <p>© 2026 My Website</p>
  </footer>

  <script>
    function showMessage() {
      alert("Yo! Your website is working 🔥");
    }
  </script>

</body>
</html>
